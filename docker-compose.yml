version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: ancient-city-postgis
    environment:
      POSTGRES_DB: ancient_city
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c 'max_connections=100' -c 'shared_buffers=256MB' -c 'effective_cache_size=768MB' -c 'work_mem=64MB' -c 'maintenance_work_mem=64MB'
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ancient_city"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  simulator:
    build: ./scripts
    container_name: ancient-city-simulator
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/ancient_city
      SEED: "42"
      DYNASTY_FILTER: ""
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - ./scripts:/app:ro
    profiles:
      - data

  backend:
    build: ./backend
    container_name: ancient-city-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/ancient_city
      RUST_LOG: info,ancient_city_morphology=debug,tracing_actix_web=info
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: ancient-city-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
